# ca65 / ld65 linker configuration for 512KB banked Atari 7800 ROMs (Mapper 1)
# Total ROM: 512 KB = 32 banks x 16 KB ($80000 bytes)
#   Banks 0..29  (480 KB): Switched data banks mapped into $4000-$7FFF via YM Port A (IOA0-IOA4)
#   Banks 30..31  (32 KB): Fixed code bank mapped into $8000-$FFFF (ROMA15-18 forced high)
#                          Also accessible through $4000-$7FFF by selecting bank 30 or 31

MEMORY {
    ZP:       file = "", start = $0080, size = $0080, type = rw, define = yes;
    RAM:      file = "", start = $1800, size = $0800, type = rw, define = yes;
    BANK0:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK1:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK2:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK3:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK4:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK5:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK6:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK7:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK8:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK9:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK10:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK11:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK12:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK13:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK14:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK15:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK16:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK17:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK18:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK19:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK20:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK21:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK22:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK23:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK24:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK25:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK26:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK27:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK28:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK29:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK30:   file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    BANK31:   file = %O, start = $C000, size = $3FF8, fill = yes, fillval = $FF;
    HEADER:   file = %O, start = $FFF8, size = $0002, fill = yes, fillval = $FF;
    VECTORS:  file = %O, start = $FFFA, size = $0006, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = RAM,     type = bss, define = yes;
    BANK0:    load = BANK0,   type = ro;
    BANK1:    load = BANK1,   type = ro;
    BANK2:    load = BANK2,   type = ro;
    BANK3:    load = BANK3,   type = ro;
    BANK4:    load = BANK4,   type = ro;
    BANK5:    load = BANK5,   type = ro;
    BANK6:    load = BANK6,   type = ro;
    BANK7:    load = BANK7,   type = ro;
    BANK8:    load = BANK8,   type = ro;
    BANK9:    load = BANK9,   type = ro;
    BANK10:   load = BANK10,  type = ro;
    BANK11:   load = BANK11,  type = ro;
    BANK12:   load = BANK12,  type = ro;
    BANK13:   load = BANK13,  type = ro;
    BANK14:   load = BANK14,  type = ro;
    BANK15:   load = BANK15,  type = ro;
    BANK16:   load = BANK16,  type = ro;
    BANK17:   load = BANK17,  type = ro;
    BANK18:   load = BANK18,  type = ro;
    BANK19:   load = BANK19,  type = ro;
    BANK20:   load = BANK20,  type = ro;
    BANK21:   load = BANK21,  type = ro;
    BANK22:   load = BANK22,  type = ro;
    BANK23:   load = BANK23,  type = ro;
    BANK24:   load = BANK24,  type = ro;
    BANK25:   load = BANK25,  type = ro;
    BANK26:   load = BANK26,  type = ro;
    BANK27:   load = BANK27,  type = ro;
    BANK28:   load = BANK28,  type = ro;
    BANK29:   load = BANK29,  type = ro;
    BANK30:   load = BANK30,  type = ro, optional = yes;
    BANK31:   load = BANK31,  type = ro, optional = yes;
    CODE:     load = BANK30,  type = ro;
    RODATA:   load = BANK30,  type = ro;
    FOOTER:   load = HEADER,  type = ro;
    VECTORS:  load = VECTORS, type = ro;
}
