name: PCB Build

# Gold-standard hardware build: every push/PR rebuilds the PLD logic and both
# PCBs from source in a pinned toolchain (KiCad 10, freerouting v2.4.1,
# galette 0.3.0). Pushing a v* tag additionally publishes the artifacts as a
# GitHub Release — those release files are the canonical gerbers/JEDs to send
# to fab and to program PLDs from.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build-pcb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/kicad/kicad:10.0
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js and Java
        run: |
          apt-get update -q
          apt-get install -y curl wget make librsvg2-bin
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          npm install -g bun

          # Install JDK 25 to run Freerouting v2.4.1
          wget -q https://corretto.aws/downloads/latest/amazon-corretto-25-x64-linux-jdk.tar.gz -O /tmp/jdk25.tar.gz
          mkdir -p /usr/local/lib/jvm
          tar -xzf /tmp/jdk25.tar.gz -C /usr/local/lib/jvm
          ln -sf /usr/local/lib/jvm/amazon-corretto-25*/bin/java /usr/local/bin/java

      # The version and SHA-256 are pinned in the Makefile; `make pcb-*` picks up the
      # downloaded jar from pcb/.tools/ without FREEROUTING_JAR being set.
      - name: Install Freerouting
        run: make freerouting

      - name: Install galette
        run: |
          apt-get install -y cargo
          cargo install galette --version 0.3.0 --root /usr/local --locked

      - name: Install Node dependencies
        run: cd pcb && bun install --frozen-lockfile

      - name: Build PLD logic (JEDEC)
        run: make logic

      - name: Build 28pin PCB
        run: |
          make pcb-28pin
          make schematic-28pin
          make previews-28pin

      - name: Collect 28pin gerbers and previews
        run: |
          cp pcb/build/gerbers.zip gerbers-28pin.zip
          cp build/pcb_front_28pin.png pcb_front_28pin.png
          cp build/pcb_back_28pin.png pcb_back_28pin.png
          cp build/pcb_3d_28pin.png pcb_3d_28pin.png

      - name: Build 32pin PCB
        run: |
          make pcb-32pin
          make schematic-32pin
          make previews-32pin

      - name: Collect 32pin gerbers and previews
        run: |
          cp pcb/build/gerbers.zip gerbers-32pin.zip
          cp build/pcb_front_32pin.png pcb_front_32pin.png
          cp build/pcb_back_32pin.png pcb_back_32pin.png
          cp build/pcb_3d_32pin.png pcb_3d_32pin.png

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcb-build
          path: |
            gerbers-28pin.zip
            gerbers-32pin.zip
            pcb_front_28pin.png
            pcb_back_28pin.png
            pcb_3d_28pin.png
            pcb_front_32pin.png
            pcb_back_32pin.png
            pcb_3d_32pin.png
            build/schematic-28pin.png
            build/schematic-32pin.png
            build/*.jed

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            gerbers-28pin.zip
            gerbers-32pin.zip
            pcb_front_28pin.png
            pcb_back_28pin.png
            pcb_3d_28pin.png
            pcb_front_32pin.png
            pcb_back_32pin.png
            pcb_3d_32pin.png
            build/schematic-28pin.png
            build/schematic-32pin.png
            build/*.jed
